<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos de Mercado — Gestão de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <i class="fa-solid fa-basket-shopping"></i>
                <h1>Produtos de Mercado</h1>
            </div>
            <p class="subtitle">Sistema de Gerenciamento e Controle de Estoque (AP2)</p>
        </div>
    </header>

    <main class="container main-layout">
        <!-- Formulário de Cadastro / Edição -->
        <section class="card form-section">
            <h2 id="form-title"><i class="fa-solid fa-plus-circle"></i> Novo Produto</h2>
            <form id="product-form">
                <input type="hidden" id="produto-id">

                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Arroz Integral 5kg">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" required placeholder="Ex: Alimentos">
                    </div>
                    <div class="form-group">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" required placeholder="Ex: Tio João">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" step="0.01" min="0" required placeholder="0,00">
                    </div>
                    <div class="form-group">
                        <label for="estoque">Estoque</label>
                        <input type="number" id="estoque" min="0" required placeholder="0">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">
                        <i class="fa-solid fa-save"></i> Salvar Produto
                    </button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;" onclick="cancelEdit()">
                        <i class="fa-solid fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Listagem de Produtos -->
        <section class="card list-section">
            <div class="list-header">
                <h2><i class="fa-solid fa-boxes-stacked"></i> Lista de Produtos</h2>
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Pesquisar produtos..." oninput="filterProducts()">
                </div>
            </div>

            <div class="table-responsive">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Marca</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <i class="fa-solid fa-box-open"></i>
                <p>Nenhum produto cadastrado no momento.</p>
            </div>
        </section>
    </main>

    <!-- Toast de Notificação -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
